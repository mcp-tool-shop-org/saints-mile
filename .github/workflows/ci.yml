name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Atlas needs Node 22 or later and this job sets up no Node, so the
      # check gets its own, ahead of the Rust toolchain.
      - name: Set up Node for the Atlas check
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      - run: cargo test
